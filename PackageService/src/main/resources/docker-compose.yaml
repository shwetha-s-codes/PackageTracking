services:
  mysql:
    image: mysql:8.0
    container_name: package-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password@123
      MYSQL_DATABASE: package_service_db
    ports:
      - "3306:3306"
    volumes:
      - package_service_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: package-service-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8090:80"
    depends_on:
      - mysql

  redis:
    image: redis:7
    container_name: package-service-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  package_service_mysql_data: