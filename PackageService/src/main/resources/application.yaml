spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/package_service_db
    username: root
    password: password@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

  springdoc:
    # Swagger UI Configuration
    swagger-ui:
      path: /swagger-ui.html           # Custom path to access Swagger UI
      enabled: true                    # Enable/disable Swagger UI
      operations-sorter: alpha          # Sort endpoints alphabetically (alpha or method)
      tags-sorter: alpha                # Sort tags alphabetically
      display-request-duration: true    # Show request execution time in ms
      doc-expansion: none               # Controls operations expansion ('none', 'list', 'full')
      filter: true                      # Enables search bar in Swagger UI

    # OpenAPI JSON/YAML Docs Endpoint Configuration
    api-docs:
      path: /v3/api-docs                # JSON OpenAPI spec endpoint
      enabled: true                     # Enable/disable raw API docs endpoint
      resolve-schema-properties: true   # Resolve spring properties inside @Schema annotations

server:
  port: 8081